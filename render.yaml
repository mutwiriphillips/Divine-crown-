services:
  - type: web
    name: josriri
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: josriri-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        value: skywalkerstalents@gmail.com

databases:
  - name: josriri-db
    plan: free
    region: frankfurt
    databaseName: josriri_sports
    user: josriri_admin
