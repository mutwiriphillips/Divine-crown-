# Render Blueprint, FREE plan, for testing the shop before paying for anything.
#   Render dashboard -> New -> Blueprint -> pick this repository.
#
# What the free plan means in practice (all of it is fine for testing, none of it for a real shop):
#  - The site goes to sleep after 15 minutes without visitors and takes about a minute to wake up.
#  - The free database is deleted after 30 days unless you upgrade it. Don't keep real data on it.
#  - Product photos are kept in the database (STORAGE_DRIVER=db) because the free plan has no disk.
#  - Background jobs run inside the web service (RUN_WORKER_IN_WEB), so they only run while it is awake.
#  - There is no Shell on the free plan, so first-time setup runs automatically at start-up (npm run bootstrap):
#    migrations, the draft catalogue, and your owner account from OWNER_EMAIL / OWNER_PASSWORD.
#
# When you are ready to go live, switch to render.paid.yaml (see the README).
databases:
  - name: divine-crown-db
    plan: free
    databaseName: shop
    user: shop

services:
  - type: web
    name: divine-crown-shop
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run use-prebuilt
    startCommand: npm run bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Keeps the running site inside the free plan's 512 MB of memory
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      # Stops Linux from holding on to freed memory; saves ~100 MB on small servers
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase: { name: divine-crown-db, property: connectionString }
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: db
      - key: RUN_WORKER_IN_WEB
        value: "true"
      # Your owner sign-in. Used once, on first start. Delete OWNER_PASSWORD from Render afterwards.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Address of the site, e.g. https://divine-crown-shop.onrender.com (shown in Render once the service exists;
      # you can fill it in after the first deploy and let it redeploy).
      - key: APP_URL
        sync: false
      # M-Pesa and email stay off for testing: leave these unset.
      # MPESA_ENV, RESEND_API_KEY, EMAIL_FROM
